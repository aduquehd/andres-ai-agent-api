[project]
name = "chat-agent"
version = "0.1.0"
description = "Chat Agent project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "greenlet>=3.2.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
    "logfire>=4.33.0",
    "openai>=3.0.0,<4",
    "opentelemetry-instrumentation-asgi>=0.53b1",
    "opentelemetry-instrumentation-asyncpg>=0.53b1",
    "opentelemetry-instrumentation-fastapi>=0.53b1",
    "pgvector>=0.4.2",
    "pyrate-limiter>=4.4.0",
    "psycopg2-binary>=2.9.10",
    "pydantic-ai>=2.32.0,<3",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.10.0",
    "redis>=8.1.0,<9",
    "ruff>=0.15.0",
    "sentry-sdk[fastapi]>=2.60.0",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.48.0",
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "dirty-equals>=0.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[tool.uv]
# anthropic 2.x moves to a new API version; stay on 1.x until pydantic-ai
# supports it, so a blanket `uv lock --upgrade` can't pull it in.
constraint-dependencies = ["anthropic<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["alembic/versions/*"]

[tool.ruff.lint]
extend-select = ["I"]
# FastAPI builds dependency injection on function calls in argument defaults
# (Depends/Form/Query) - the exact pattern B008 exists to flag.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["chat_agent"]  # Replace with your package/module name
combine-as-imports = true
lines-after-imports = 2
